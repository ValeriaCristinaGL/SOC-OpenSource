version: '3.7'

services:
  # -------------------- Geração de Certificados (EXECUTAR APENAS UMA VEZ) --------------------
  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:0.0.1
    hostname: wazuh-certs-generator
    container_name: wazuh-certs-generator
    volumes:
      - ./wazuh-certs:/usr/share/wazuh-certs-generator/output
    environment:
      - WAZUH_VERSION=4.7.4

  # -------------------- WAZUH INDEXER (Backend de Armazenamento) --------------------
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.4 # Versão recomendada
    hostname: wazuh-indexer
    container_name: wazuh-indexer
    ports:
      - "9200:9200" # Porta para o Dashboard
    environment:
      - discovery.type=single-node
      # Senha para o usuário 'admin' do Indexer e Dashboard (lida do arquivo secret)
      - WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password
      # Chave para criptografia de dados de configuração (lida do arquivo secret)
      - WAZUH_INDEXER_SECURITY_CONFIG_PASSWORD_FILE=/run/secrets/wazuh_indexer_key
    volumes:
      - wazuh_indexer_data:/usr/share/wazuh-indexer/data
      # Montando os certificados gerados
      - ./wazuh-certs/wazuh-indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer.pem
      - ./wazuh-certs/wazuh-indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer-key.pem
      - ./wazuh-certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
    secrets:
      - souce: wazuh_indexer_password
        target: wazuh_indexer_password
      - souce: wazuh_indexer_key
        target: wazuh_indexer_key
    networks:
      - wazuh-net

  # -------------------- WAZUH MANAGER (Servidor Central SIEM) --------------------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.4
    hostname: wazuh-manager
    container_name: wazuh-manager
    ports:
      - "1514:1514/udp" # Porta para logs Syslog (futuro Suricata)
      - "1515:1515"     # Porta para comunicação com Agentes Wazuh
      - "55000:55000"   # Porta para API (Opcional, se o Dashboard não estiver no mesmo compose)
    environment:
      # Use o nome do host do Indexer no mesmo compose
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      # Senha do usuário 'admin' para o Manager autenticar no Indexer
      - WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password
    volumes:
      - wazuh_manager_data:/var/ossec
      # Montando os certificados gerados
      - ./wazuh-certs/wazuh-manager.pem:/var/ossec/etc/certs/wazuh-manager.pem
      - ./wazuh-certs/wazuh-manager-key.pem:/var/ossec/etc/certs/wazuh-manager-key.pem
      - ./wazuh-certs/root-ca.pem:/var/ossec/etc/certs/root-ca.pem
      # Diretórios para customização de regras e decodificadores (para futuras sprints)
      - ./wazuh-manager/rules:/var/ossec/etc/rules:ro
      - ./wazuh-manager/decoders:/var/ossec/etc/decoders:ro
    secrets:
      - souce: wazuh_indexer_password
        target: wazuh_indexer_password
    depends_on:
      - wazuh-indexer
    networks:
      - wazuh-net

  # -------------------- WAZUH DASHBOARD (Interface Web) --------------------
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.4
    hostname: wazuh-dashboard
    container_name: wazuh-dashboard
    ports:
      - "443:5601" # Porta para acesso via HTTPS (padrão 5601, mas 443 é comum para web)
    environment:
      # Variáveis para conexão segura com o Indexer
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      # As credenciais para o login inicial serão 'admin' e a senha definida no secret
      - WAZUH_INDEXER_PASSWORD_FILE=/run/secrets/wazuh_indexer_password
      # URL da API do Manager
      - WAZUH_API_URL=https://wazuh-manager:55000
    volumes:
      - wazuh_dashboard_data:/usr/share/wazuh-dashboard/data
      # Montando os certificados gerados
      - ./wazuh-certs/wazuh-dashboard.pem:/usr/share/wazuh-dashboard/config/certs/wazuh-dashboard.pem
      - ./wazuh-certs/wazuh-dashboard-key.pem:/usr/share/wazuh-dashboard/config/certs/wazuh-dashboard-key.pem
      - ./wazuh-certs/root-ca.pem:/usr/share/wazuh-dashboard/config/certs/root-ca.pem
    secrets:
      - source: wazuh_indexer_password
        target: wazuh_indexer_password
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - wazuh-net

volumes:
  wazuh_indexer_data:
  wazuh_manager_data:
  wazuh_dashboard_data:

secrets:
  wazuh_indexer_password:
    file: ./wazuh_indexer_password.txt
  wazuh_indexer_key:
    file: ./secrets/wazuh_indexer_key.txt

networks:
  wazuh-net:
    driver: bridge